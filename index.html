html<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>VTS Radar Simulator - Fail-Safe Edition</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #02060c; font-family: 'Courier New', monospace; color: #fff; }
        #container { display: flex; width: 100vw; height: 100vh; }
        
        /* Het Radarschermgebied */
        #radar-area { 
            flex: 1; 
            background: #040d1a; 
            position: relative; 
            border: 2px solid #00ffcc; 
            margin: 15px; 
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,255,204,0.2);
        }
        
        /* De Schepen (Targets) als felle, klikbare blokken */
        .vessel {
            position: absolute;
            width: 24px;
            height: 24px;
            background: #00ffcc;
            border: 2px solid #fff;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 10px #00ffcc;
            transition: top 0.1s linear, left 0.1s linear;
        }
        .vessel::after {
            content: attr(data-name);
            position: absolute;
            top: 28px;
            left: -20px;
            font-size: 10px;
            white-space: nowrap;
            background: rgba(0,0,0,0.7);
            padding: 2px 5px;
            border-radius: 3px;
        }
        
        /* Rechter VTS Controlepaneel */
        #vts-panel { 
            width: 320px; 
            background: rgba(6, 18, 36, 0.95); 
            padding: 20px; 
            border-left: 2px solid #00ffcc; 
            box-shadow: -5px 0 15px rgba(0, 255, 204, 0.2);
            box-sizing: border-box;
        }
        h2 { margin: 0 0 5px 0; color: #00ffcc; font-size: 16px; letter-spacing: 1px; text-shadow: 0 0 5px #00ffcc; }
        .ship-entry { padding: 8px 0; border-bottom: 1px dashed rgba(0,255,204,0.2); font-size: 12px; }
        .highlight { color: #ffcc00; font-weight: bold; }
        .btn { background: #00ffcc; color: #02060c; border: none; padding: 10px; font-family: monospace; font-weight: bold; cursor: pointer; border-radius: 3px; margin-top: 15px; width: 100%; font-size: 13px; }
        .btn:hover { background: #ffcc00; }
    </style>
</head>
<body>

    <div id="container">
        <!-- Links: Het fysieke radarscherm waar de targets IN staan -->
        <div id="radar-area" id="radarScreen">
            <!-- Schip 1 -->
            <div id="ship1" class="vessel" data-name="SCH-24" style="left: 20%; top: 30%;" onclick="selectShip(1)"></div>
            <!-- Schip 2 -->
            <div id="ship2" class="vessel" data-name="ALTAIR" style="left: 70%; top: 60%;" onclick="selectShip(2)"></div>
        </div>

        <!-- Rechts: Het VTS Informatiepaneel -->
        <div id="vts-panel">
            <h2>VTS RADAR CONTROL</h2>
            <p style="font-size:11px; margin:0 0 10px 0; color: #8ab4f8;">SECTOR: SCHEVENINGEN APPROACH</p>
            <p style="font-size:12px; margin:0;">STATUS: <span style="color:#00ff00; font-weight:bold;">STANDALONE OK</span></p>
            <p style="font-size:12px; margin:5px 0 0 0;">ACTIEVE TARGETS: <span class="highlight">2</span></p>
            <hr style="border-color: rgba(0,255,204,0.3); margin: 15px 0;">
            
            <div id="ship-info"><i>Klik op een bewegend target aan de linkerkant voor AIS-data.</i></div>
            
            <hr style="border-color: rgba(0,255,204,0.3); margin: 15px 0;">
            <h2>ALARM STATUS</h2>
            <div id="alarm-box" style="color: #00ff00; font-size: 12px; font-weight: bold;">CPA STATUS: VEILIG</div>
        </div>
    </div>

    <script>
        // Posities en snelheden van de 2 targets
        let ships = {
            1: { name: "SCH-24 SCHEVENINGEN", x: 20, y: 30, dx: 0.1, dy: 0.05, mmsi: "244670000", type: "Visserstrawler", heading: 120 },
            2: { name: "PILOT LAUNCH ALTAIR", x: 70, y: 60, dx: -0.08, dy: -0.06, mmsi: "244123999", type: "Loodsboot", heading: 310 }
        };

        let currentSelected = null;

        // Selecteer een schip en toon direct de data rechts
        window.selectShip = function(id) {
            currentSelected = id;
            let ship = ships[id];
            
            // Reset alle kleuren en maak de geselecteerde geel
            document.querySelectorAll('.vessel').forEach(v => v.style.background = '#00ffcc');
            document.getElementById('ship' + id).style.background = '#ffcc00';

            document.getElementById('ship-info').innerHTML = `
                <div class="ship-entry"><b>TARGET:</b> <span class="highlight">${ship.name}</span></div>
                <div class="ship-entry"><b>MMSI:</b> ${ship.mmsi}</div>
                <div class="ship-entry"><b>TYPE:</b> ${ship.type}</div>
                <div class="ship-entry"><b>HEADING:</b> ${ship.heading}°</div>
                <div class="ship-entry"><b>SPEED:</b> 12.4 KNTS</div>
                <button class="btn" onclick="alterCourse()">⚠️ WIJZIG KOERS (INGRIJPEN)</button>
            `;
        };

        // De koerswijziging-knop (De operator grijpt in)
        window.alterCourse = function() {
            if (currentSelected) {
                let ship = ships[currentSelected];
                // Keer de richting om zodat ze direct wegdraaien en niet botsen
                ship.dx = -ship.dx;
                ship.dy = -ship.dy;
                ship.heading = (ship.heading + 180) % 360;
                
                // Update het paneel
                selectShip(currentSelected);
            }
        };

        // De simulatie-engine (Beweegt de blokjes live over het scherm)
        setInterval(() => {
            for (let id in ships) {
                let ship = ships[id];
                
                // Update posities
                ship.x += ship.dx;
                ship.y += ship.dy;

                // Grenzen bewaken (binnen het scherm houden)
                if (ship.x < 5 || ship.x > 90) ship.dx = -ship.dx;
                if (ship.y < 5 || ship.y > 90) ship.dy = -ship.dy;

                // Verplaats het HTML-element op het scherm
                let el = document.getElementById('ship' + id);
                if (el) {
                    el.style.left = ship.x + '%';
                    el.style.top = ship.y + '%';
                }
            }

            // Bereken onderlinge afstand voor het CPA alarm
            let dist = Math.sqrt((ships[1].x - ships[2].x)**2 + (ships[1].y - ships[2].y)**2);
            let alarmBox = document.getElementById('alarm-box');
            
            if (dist < 10) {
                alarmBox.innerHTML = "⚠️ ALARM: CLOSE APPROACH! CRITICAL";
                alarmBox.style.color = "#ff3333";
                document.getElementById('ship1').style.background = '#ff3333';
                document.getElementById('ship2').style.background = '#ff3333';
            } else {
                alarmBox.innerHTML = "CPA STATUS: VEILIG";
                alarmBox.style.color = "#00ff00";
            }
        }, 100);
    </script>
</body>
</html>
