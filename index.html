html<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTS Simulator - Sector Rotterdam Maasmond</title>
    <style>
        :root {
            --bg-color: #080c14;
            --panel-bg: #121824;
            --radar-green: #00ff66;
            --radar-orange: #ff9900;
            --text-color: #e2e8f0;
            --border-color: #232d42;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-gap: 20px;
            height: 95vh;
        }

        .main-panel {
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            position: relative;
        }

        .side-panel {
            display: grid;
            grid-template-rows: 1.2fr 0.8fr;
            grid-gap: 20px;
            height: 100%;
        }

        .panel-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .table-wrapper {
            overflow-y: auto;
            flex-grow: 1;
        }

        h2 {
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            font-size: 1.2rem;
            color: var(--radar-green);
        }

        #radarCanvas {
            background-color: #030508;
            border: 2px solid var(--radar-green);
            border-radius: 50%;
            display: block;
            margin: auto;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.15);
        }

        .ship-list-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .ship-list-table th, .ship-list-table td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .ship-list-table th {
            color: #a0aec0;
            position: sticky;
            top: 0;
            background: var(--panel-bg);
        }

        #vhf-log {
            background: #030508;
            border: 1px solid var(--border-color);
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            flex-grow: 1;
            overflow-y: auto;
            color: #38bdf8;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: #1e293b;
            color: white;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        button:hover {
            background: var(--radar-green);
            color: black;
            font-weight: bold;
        }

        .btn-alert {
            background: #7f1d1d;
            border-color: #ef4444;
        }
        .btn-alert:hover {
            background: #ef4444;
            color: white;
        }

        .status-bar {
            position: absolute;
            bottom: 10px;
            left: 15px;
            font-size: 0.85rem;
            color: #718096;
        }
    </style>
</head>
<body>

    <!-- Linkerpaneel: Radarscherm -->
    <div class="main-panel">
        <h2>Rotterdam Port Control - Sector Maasmond</h2>
        <canvas id="radarCanvas" width="550" height="550"></canvas>
        <div class="controls">
            <button onclick="changeZoom(1)">Zoom In</button>
            <button onclick="changeZoom(-1)">Zoom Uit</button>
            <button onclick="triggerIncident()" class="btn-alert">Simuleer Incident (Calandkanaal)</button>
        </div>
        <div class="status-bar">VTS-Systeem: Actief | Regio: Rotterdam Aanloop | Basis: Hook of Holland VTS</div>
    </div>

    <!-- Rechterpaneel: Informatie & Communicatie -->
    <div class="side-panel">
        <!-- Schepen Overzicht -->
        <div class="panel-box">
            <h2>Live AIS Verkeer (Rotterdam)</h2>
            <div class="table-wrapper">
                <table class="ship-list-table">
                    <thead>
                        <tr>
                            <th>Schip</th>
                            <th>Bestemming</th>
                            <th>Krs / Snelheid</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="ship-table-body">
                        <!-- Dynamisch -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- VHF Radio Log -->
        <div class="panel-box">
            <h2>VHF Radioverkeer (VHF Ch 11 / Ch 14)</h2>
            <div id="vhf-log"></div>
            <div class="controls" style="margin-top: 10px;">
                <input type="text" id="vhf-input" placeholder="Roep schip op of zend instructie..." style="flex-grow: 1; padding: 7px; background: #0f172a; border: 1px solid var(--border-color); color: white; border-radius: 4px; font-size: 0.85rem;">
                <button onclick="sendVHFMessage()">Zend</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        let radarRadius = canvas.width / 2 - 15;
        let scanAngle = 0;
        let zoomLevel = 1.0;

        // Rotterdam-specifieke schepen & posities relatief ten opzichte van de Maasmond (0,0)
        let ships = [
            { id: 0, name: "CMA CGM Antoine", type: "Container", destination: "Maasvlakte II", x: -140, y: -40, vx: 0.18, vy: 0.05, course: 74, speed: 15.1, status: "Inbound" },
            { id: 1, name: "Stolt Rotterdam", type: "Tanker", destination: "Botlek", x: 40, y: 15, vx: 0.08, vy: -0.02, course: 102, speed: 8.4, status: "Inbound" },
            { id: 2, name: "Ever Given", type: "Container", destination: "Prinses Amaliahaven", x: -60, y: -15, vx: 0.12, vy: 0.04, course: 72, speed: 11.0, status: "Inbound" },
            { id: 3, name: "P&O Pioneer", type: "RoRo Ferry", destination: "Europoort", x: 10, y: 55, vx: -0.15, vy: -0.10, course: 236, speed: 16.5, status: "Outbound" },
            { id: 4, name: "Smit Cheetah", type: "Tugboat", destination: "Maasvlakte Anchorage", x: -100, y: 80, vx: 0, vy: 0, course: 0, speed: 0.0, status: "Standby" }
        ];

        function logVHF(sender, text) {
            const log = document.getElementById('vhf-log');
            const time = new Date().toLocaleTimeString();
            log.innerHTML += `<div>[${time}] <strong>${sender}:</strong> ${text}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        // Teken de schematische kustlijn en vaargeulen van Rotterdam
        function drawRotterdamMap() {
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.1)';
            ctx.fillStyle = 'rgba(0, 255, 102, 0.02)';
            ctx.lineWidth = 1.5;

            ctx.beginPath();
            ctx.moveTo(centerX + (20 * zoomLevel), centerY - (250 * zoomLevel));
            ctx.lineTo(centerX + (30 * zoomLevel), centerY - (30 * zoomLevel));
            ctx.lineTo(centerX + (250 * zoomLevel), centerY - (10 * zoomLevel));
            ctx.lineTo(centerX + (250 * zoomLevel), centerY + (20 * zoomLevel));
            ctx.lineTo(centerX + (50 * zoomLevel), centerY + (30 * zoomLevel));
            ctx.lineTo(centerX + (180 * zoomLevel), centerY + (60 * zoomLevel));
            ctx.lineTo(centerX + (150 * zoomLevel), centerY + (90 * zoomLevel));
            ctx.lineTo(centerX + (10 * zoomLevel), centerY + (60 * zoomLevel));
            ctx.lineTo(centerX - (30 * zoomLevel), centerY + (110 * zoomLevel));
            ctx.lineTo(centerX - (100 * zoomLevel), centerY + (60 * zoomLevel));
            ctx.lineTo(centerX - (40 * zoomLevel), centerY - (10 * zoomLevel));
            ctx.closePath();
            ctx.stroke();
            ctx.fill();

            // Eurogeul / Maasgeul (Inlooplijn vanaf zee)
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.07)';
            ctx.beginPath();
            ctx.moveTo(centerX - (250 * zoomLevel), centerY - (80 * zoomLevel));
            ctx.lineTo(centerX - (40 * zoomLevel), centerY - (10 * zoomLevel));
            ctx.stroke();
        }

        function drawRadar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Teken geografische kaart
            drawRotterdamMap();

            // Afstandsringen
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.15)';
            ctx.lineWidth = 1;
            for (let r = 60; r <= radarRadius; r += 60) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, r, 0, 2 * Math.PI);
                ctx.stroke();
            }

            // Radarnaald sweep
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.3)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(centerX + radarRadius * Math.cos(scanAngle), centerY + radarRadius * Math.sin(scanAngle));
            ctx.stroke();

            // Schepen plotten
            ships.forEach(ship => {
                // Positie-update
                ship.x += ship.vx;
