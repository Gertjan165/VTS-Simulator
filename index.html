html<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live AIS VTS Monitor - Rotterdam</title>
    
    <!-- Leaflet Kaart CSS -->
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        #map {
            width: 100vw;
            height: 100vh;
        }
        .vts-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(18, 24, 36, 0.9);
            border: 1px solid #232d42;
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
            width: 300px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h3 { margin-top: 0; color: #00ff66; border-bottom: 1px solid #232d42; padding-bottom: 5px;}
        .ship-update { font-family: monospace; font-size: 11px; color: #38bdf8; margin-bottom: 4px; }
    </style>
</head>
<body>

    <!-- Het Kaart Element -->
    <div id="map"></div>

    <!-- Live VTS Info Paneel -->
    <div class="vts-panel">
        <h3>Live AIS Stream (Maasmond)</h3>
        <p style="font-size: 12px; color: #a0aec0;">Verbonden met AISStream.io. Targets worden live geplot.</p>
        <div id="stream-log"></div>
    </div>

    <!-- Leaflet Kaart JavaScript -->
    <script src="https://unpkg.com"></script>

    <script>
        // 1. Initialiseer de zeekaart gecentreerd op de Haven van Rotterdam (Maasmond)
        // We gebruiken OpenSeaMap als overlay voor maritieme tonnen en boeien
        const map = L.map('map').setView([51.985, 4.020], 12);

        // Basiskaart (Donkere CartoDB tiles past goed bij een VTS scherm)
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Voeg de officiële OpenSeaMap maritieme kaartlaag toe (boeien, lichten, vaargeulen)
        L.tileLayer('https://openseamap.org{z}/{x}/{y}.png', {
            attribution: 'Map data © OpenSeaMap contributors'
        }).addTo(map);

        // Object om actieve scheepsmarkers in bij te houden
        const shipMarkers = {};
        const logBox = document.getElementById('stream-log');

        // 2. LIVE AIS INSTELLINGEN
        // VERVANG DIT DOOR JE EIGEN KEY VAN AISSTREAM.IO!
        const API_KEY = "JOUW_AISSTREAM_API_KEY_HIER"; 

        if (API_KEY === "JOUW_AISSTREAM_API_KEY_HIER") {
            alert("Vergeet niet je eigen API key van AISStream.io in de JavaScript-code te plakken!");
        }

        // We maken een WebSocket verbinding met de wereldwijde feed
        const socket = new WebSocket("wss://stream.aisstream.io/v0/stream");

        socket.onopen = function(_) {
            console.log("WebSocket Verbonden!");
            
            // We sturen een verzoek om ALLEEN schepen in de regio Rotterdam te ontvangen (Bounding Box)
            const subscriptionMessage = {
                APIKey: API_KEY,
                BoundingBoxes: [[[51.90, 3.80], [52.10, 4.30]]] // Noordzee / Maasmond regio
            };
            
            socket.send(JSON.stringify(subscriptionMessage));
        };

        socket.onmessage = function(event) {
            const aisData = JSON.parse(event.data);
            
            // We filteren specifiek op positierapporten (MessageID 1, 2, 3 of 18)
            if (aisData.MessageType === "PositionReport") {
                const message = aisData.Message.PositionReport;
                const mmsi = message.MMSI;
                const lat = message.Latitude;
                const lon = message.Longitude;
                const speed = message.Sog; // Speed Over Ground
                const course = message.Cog; // Course Over Ground
                const name = aisData.MetaData.ShipName || `MMSI: ${mmsi}`;

                // Update de live loglijst in het rechterpaneel
                const time = new Date().toLocaleTimeString();
                logBox.innerHTML = `<div class="ship-update">[${time}] ${name} (${speed} kts)</div>` + logBox.innerHTML;
                if (logBox.children.length > 8) logBox.removeChild(logBox.lastChild);

                // Als het schip al op de kaart staat, update de positie. Anders: maak nieuwe marker.
                if (shipMarkers[mmsi]) {
                    shipMarkers[mmsi].setLatLng([lat, lon]);
                    shipMarkers[mmsi].setPopupContent(`<b>${name}</b><br>Snelheid: ${speed} knopen<br>Koers: ${course}°`);
                } else {
                    // Maak een VTS-stijl cirkel-marker voor het schip
                    const marker = L.circleMarker([lat, lon], {
                        radius: 6,
                        color: '#00ff66',
                        fillColor: '#00ff66',
                        fillOpacity: 0.8,
                        weight: 2
                    }).addTo(map);

                    marker.bindPopup(`<b>${name}</b><br>Snelheid: ${speed} knopen<br>Koers: ${course}°`);
                    shipMarkers[mmsi] = marker;
                }
            }
        };

        socket.onerror = function(err) {
            console.error("VTS Stream Fout: ", err);
        };

        socket.onclose = function() {
            console.log("Stream gesloten.");
        };
    </script>
</body>
</html>
