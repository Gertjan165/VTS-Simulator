<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>VTS Simulator - Scheveningen</title>
    <!-- Leaflet Kaart CSS via CDN -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    <style>
        /* Forceer dat de browser de kaart op volledig scherm toont */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b111e; font-family: monospace; }
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Modern VTS controlepaneel over de kaart heen */
        #vts-panel { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            background: rgba(6, 18, 36, 0.9); 
            padding: 20px; 
            border-radius: 6px; 
            z-index: 1000; 
            width: 280px; 
            border: 2px solid #00ffcc; 
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            color: #fff;
        }
        h2 { margin: 0 0 5px 0; color: #00ffcc; font-size: 16px; letter-spacing: 1px; }
        .ship-entry { padding: 6px 0; border-bottom: 1px dashed rgba(0,255,204,0.2); font-size: 12px; }
        .highlight { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Het VTS Controlepaneel aan de rechterkant -->
    <div id="vts-panel">
        <h2>VTS RADAR CONTROL</h2>
        <p style="font-size:12px; margin:0 0 10px 0;">STATUS: <span style="color:#00ff00; font-weight:bold;">ONLINE</span></p>
        <p style="font-size:12px; margin:0;">ACTIEVE TARGETS: <span class="highlight">2</span></p>
        <hr style="border-color: rgba(0,255,204,0.3); margin: 10px 0;">
        <div id="ship-info"><i>Klik op een target voor AIS-informatie.</i></div>
    </div>
    
    <!-- De Kaart Container -->
    <div id="map"></div>

    <!-- Leaflet Kaart JavaScript via CDN -->
    <script src="https://cloudflare.com"></script>
    <script>
        // 1. Initialiseer de kaart op Scheveningen
        const map = L.map('map', { zoomControl: true }).setView([52.103, 4.250], 13);

        // 2. Ultra-stabiele, lichte radar achtergrondkaart (CartoDB Dark Matter)
        // Deze laadt gegarandeerd sneller en geeft direct een échte radar-look!
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap, © CARTO'
        }).addTo(map);

        // 3. De 2 actieve targets voor Scheveningen
        let ships = [
            { id: 1, name: "SCH-24 SCHEVENINGEN", lat: 52.115, lng: 4.210, speedX: 0.00015, speedY: -0.00012, course: 130, mmsi: "244670000", type: "Visserstrawler" },
            { id: 2, name: "PILOT LAUNCH ALTAIR", lat: 52.092, lng: 4.225, speedX: 0.00018, speedY: 0.00014, course: 50, mmsi: "244123999", type: "Loodsboot" }
        ];

        let markers = {};

        // 4. Teken de schepen als felle VTS-stippen
        ships.forEach(ship => {
            let marker = L.circleMarker([ship.lat, ship.lng], {
                color: '#00ffcc', 
                fillColor: '#061224',
                radius: 8,
                fillOpacity: 0.9,
                weight: 2
            }).addTo(map);

            // Koppel de klik-actie om data naar het rechterpaneel te sturen
            marker.on('click', () => {
                document.getElementById('ship-info').innerHTML = `
                    <div class="ship-entry"><b>NAAM:</b> <span class="highlight">${ship.name}</span></div>
                    <div class="ship-entry"><b>MMSI:</b> ${ship.mmsi}</div>
                    <div class="ship-entry"><b>TYPE:</b> ${ship.type}</div>
                    <div class="ship-entry"><b>KOERS:</b> ${ship.course}°</div>
                    <div class="ship-entry"><b>POS:</b> ${ship.lat.toFixed(4)}, ${ship.lng.toFixed(4)}</div>
                `;
            });

            markers[ship.id] = marker;
        });

        // 5. De VTS-Engine: Beweeg de schepen live elke seconde
        setInterval(() => {
            ships.forEach(ship => {
                ship.lat += ship.speedY;
                ship.lng += ship.speedX;
                markers[ship.id].setLatLng([ship.lat, ship.lng]);
            });
        }, 1000);

        // 6. Forceer de browser om de kaart direct goed uit te lijnen bij het opstarten
        setTimeout(() => { map.invalidateSize(); }, 200);
    </script>
</body>
</html>
