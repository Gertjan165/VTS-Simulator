html<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTS Simulator - Basis Console</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #161b26;
            --radar-green: #00ff66;
            --text-color: #e2e8f0;
            --border-color: #2d3748;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-gap: 20px;
            height: 95vh;
        }

        .main-panel {
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            position: relative;
        }

        .side-panel {
            display: grid;
            grid-template-rows: 1fr 1fr;
            grid-gap: 20px;
        }

        .panel-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
        }

        h2 {
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            font-size: 1.2rem;
            color: var(--radar-green);
        }

        #radarCanvas {
            background-color: #05070b;
            border: 2px solid var(--radar-green);
            border-radius: 50%;
            display: block;
            margin: auto;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
        }

        .ship-list-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .ship-list-table th, .ship-list-table td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .ship-list-table th {
            color: #a0aec0;
        }

        #vhf-log {
            background: #000;
            border: 1px solid var(--border-color);
            padding: 10px;
            font-family: monospace;
            height: 150px;
            overflow-y: auto;
            color: #38bdf8;
            border-radius: 4px;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            background: #1e293b;
            color: white;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: var(--radar-green);
            color: black;
            font-weight: bold;
        }

        .status-bar {
            position: absolute;
            bottom: 10px;
            left: 15px;
            font-size: 0.85rem;
            color: #718096;
        }
    </style>
</head>
<body>

    <!-- Linkerpaneel: Radarscherm -->
    <div class="main-panel">
        <h2>VTS Live Radarscherm (Sector Noord)</h2>
        <canvas id="radarCanvas" width="500" height="500"></canvas>
        <div class="controls">
            <button onclick="changeZoom(1)">Zoom In</button>
            <button onclick="changeZoom(-1)">Zoom Uit</button>
            <button onclick="triggerAlert()">VHF Noodoproep (Mayday)</button>
        </div>
        <div class="status-bar">VTS Systeem Status: Operationeel | Sector: Maasmond | Bereik: 12 NM</div>
    </div>

    <!-- Rechterpaneel: Informatie & Communicatie -->
    <div class="side-panel">
        <!-- Schepen Overzicht -->
        <div class="panel-box">
            <h2>Gedetecteerde Schepen (AIS)</h2>
            <table class="ship-list-table">
                <thead>
                    <tr>
                        <th>Schip</th>
                        <th>Koers</th>
                        <th>Snelheid</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="ship-table-body">
                    <!-- Dynamisch ingeladen via JS -->
                </tbody>
            </table>
        </div>

        <!-- VHF Radio Log -->
        <div class="panel-box">
            <h2>VHF Radioverkeer (Ch 16 / Ch 12)</h2>
            <div id="vhf-log"></div>
            <div class="controls" style="margin-top: 10px;">
                <input type="text" id="vhf-input" placeholder="Type VTS bericht..." style="flex-grow: 1; padding: 6px; background: #0f172a; border: 1px solid var(--border-color); color: white; border-radius: 4px;">
                <button onclick="sendVHFMessage()">Zend</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        let radarRadius = canvas.width / 2 - 10;
        let scanAngle = 0;
        let zoomLevel = 1;

        // Statische mock data voor schepen in de VTS sector
        let ships = [
            { name: "Maersk Voyager", x: 120, y: -80, vx: 0.2, vy: 0.1, course: 56, speed: 14.2, status: "Underway" },
            { name: "Rotterdam Express", x: -60, y: 140, vx: -0.1, vy: -0.15, course: 210, speed: 11.5, status: "Underway" },
            { name: "Atlantic Orca", x: 40, y: 20, vx: 0, vy: 0, course: 0, speed: 0.0, status: "Anchored" }
        ];

        function logVHF(sender, text) {
            const log = document.getElementById('vhf-log');
            const time = new Date().toLocaleTimeString();
            log.innerHTML += `<div>[${time}] <strong>${sender}:</strong> ${text}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        // Teken het radar grid en de schepen
        function drawRadar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Achtergrond cirkels (Afstandsringen)
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.2)';
            ctx.lineWidth = 1;
            for (let r = 50; r <= radarRadius; r += 50) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, r, 0, 2 * Math.PI);
                ctx.stroke();
            }

            // Kruislijnen (Kardinale assen)
            ctx.beginPath();
            ctx.moveTo(centerX, 0); ctx.lineTo(centerX, canvas.height);
            ctx.moveTo(0, centerY); ctx.lineTo(canvas.width, centerY);
            ctx.stroke();

            // Radarnld sweep effect
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(centerX + radarRadius * Math.cos(scanAngle), centerY + radarRadius * Math.sin(scanAngle));
            ctx.stroke();

            // Update en teken schepen
            ships.forEach(ship => {
                // Update posities op basis van snelheid vector
                ship.x += ship.vx;
                ship.y += ship.vy;

                // Converteer relatieve posities naar canvascoördinaten inclusief zoom
                let screenX = centerX + (ship.x * zoomLevel);
                let screenY = centerY + (ship.y * zoomLevel);

                // Controleer of schip binnen het radarscherm valt
                let dist = Math.sqrt(Math.pow(screenX - centerX, 2) + Math.pow(screenY - centerY, 2));
                if (dist < radarRadius) {
                    // Teken Schip Blip
                    ctx.fillStyle = varColorForStatus(ship.status);
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, 5, 0, 2 * Math.PI);
                    ctx.fill();

                    // Richtingslijn (Koers)
                    ctx.strokeStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.moveTo(screenX, screenY);
                    ctx.lineTo(screenX + (ship.vx * 50), screenY + (ship.vy * 50));
                    ctx.stroke();

                    // Naamlabel
                    ctx.fillStyle = '#a0aec0';
                    ctx.font = '10px monospace';
                    ctx.fillText(ship.name, screenX + 8, screenY - 5);
                }
            });

            // Update sweep hoek
            scanAngle += 0.01;
            requestAnimationFrame(drawRadar);
        }

        function varColorForStatus(status) {
            if(status === "Anchored") return '#e2e8f0';
            if(status === "Emergency") return '#ef4444';
            return '#00ff66';
        }

        // Update de AIS tabel aan de rechterkant
        function updateShipTable() {
            const tbody = document.getElementById('ship-table-body');
            tbody.innerHTML = '';
            ships.forEach(ship => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight:bold;">${ship.name}</td>
                    <td>${ship.course}°</td>
                    <td>${ship.speed} kn</td>
                    <td style="color:${varColorForStatus(ship.status)}">${ship.status}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function changeZoom(dir) {
            if (dir > 0 && zoomLevel < 2) zoomLevel += 0.2;
            if (dir < 0 && zoomLevel > 0.4) zoomLevel -= 0.2;
        }

        function triggerAlert() {
            ships[0].status = "Emergency";
            ships[0].vx = 0; ships[0].vy = 0; shipSpeed = 0;
            logVHF(ships[0].name, "MAYDAY, MAYDAY, MAYDAY. We hebben een machinekamerbrand opgelopen. Positie nabij boei Alpha.");
            updateShipTable();
        }
